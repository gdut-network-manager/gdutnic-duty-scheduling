{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "duty-scheduling keeps sessions and a ReadWriteOnce volume in the pod; replicaCount must be 1" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duty-scheduling.fullname" . }}
  labels:
    {{- include "duty-scheduling.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The application holds sessions, rate-limit counters and background workers in
  # memory and writes to a ReadWriteOnce volume, so old and new pods must not overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "duty-scheduling.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "duty-scheduling.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "duty-scheduling.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 50025
              protocol: TCP
          {{/*
          Env precedence inside the chart (later wins):
            1. values-derived entries below
            2. .Values.environment
            3. .Values.extraEnv (supports valueFrom)
          Kubernetes gives `env` precedence over `envFrom`, so a variable listed
          here shadows the same key from .Values.envFromSecrets. Empty values are
          omitted instead of being rendered as "", otherwise they would silently
          mask a value supplied through envFromSecrets.
          */}}
          {{- $env := dict -}}
          {{- $_ := set $env "DB_BACKEND" (dict "value" (toString .Values.database.backend)) -}}
          {{- if .Values.mysql.enabled -}}
          {{- $_ := set $env "MYSQL_HOST" (dict "value" (include "duty-scheduling.mysqlFullname" .)) -}}
          {{- $_ := set $env "MYSQL_PORT" (dict "value" "3306") -}}
          {{- else -}}
          {{- $_ := set $env "MYSQL_HOST" (dict "value" (toString .Values.database.host)) -}}
          {{- $_ := set $env "MYSQL_PORT" (dict "value" (toString .Values.database.port)) -}}
          {{- end -}}
          {{- $_ := set $env "MYSQL_DATABASE" (dict "value" (toString .Values.database.name)) -}}
          {{- $_ := set $env "MYSQL_USER" (dict "value" (toString .Values.database.user)) -}}
          {{- $_ := set $env "MYSQL_PASSWORD" (dict "valueFrom" (dict "secretKeyRef" (dict "name" (include "duty-scheduling.secretName" .) "key" "MYSQL_PASSWORD"))) -}}
          {{- $_ := set $env "SESSION_SECRET" (dict "valueFrom" (dict "secretKeyRef" (dict "name" (include "duty-scheduling.secretName" .) "key" "SESSION_SECRET"))) -}}
          {{- $_ := set $env "KEYCLOAK_CLIENT_SECRET" (dict "valueFrom" (dict "secretKeyRef" (dict "name" (include "duty-scheduling.secretName" .) "key" "KEYCLOAK_CLIENT_SECRET" "optional" true))) -}}
          {{- $_ := set $env "KEYCLOAK_ENABLED" (dict "value" (toString .Values.keycloak.enabled)) -}}
          {{- $_ := set $env "KEYCLOAK_ISSUER" (dict "value" (toString .Values.keycloak.issuer)) -}}
          {{- $_ := set $env "KEYCLOAK_CLIENT_ID" (dict "value" (toString .Values.keycloak.clientId)) -}}
          {{- $_ := set $env "KEYCLOAK_REDIRECT_URI" (dict "value" (toString .Values.keycloak.redirectUri)) -}}
          {{- $_ := set $env "KEYCLOAK_USERNAME_CLAIM" (dict "value" (toString .Values.keycloak.usernameClaim)) -}}
          {{- $_ := set $env "SESSION_HTTPS_ONLY" (dict "value" (toString .Values.sessionHttpsOnly)) -}}
          {{- if .Values.clientIpHeader -}}
          {{- $_ := set $env "CLIENT_IP_HEADER" (dict "value" (toString .Values.clientIpHeader)) -}}
          {{- end -}}
          {{- if .Values.publicBaseUrl -}}
          {{- $_ := set $env "PUBLIC_BASE_URL" (dict "value" (toString .Values.publicBaseUrl)) -}}
          {{- end -}}
          {{- range $key, $value := .Values.environment -}}
          {{- $_ := set $env $key (dict "value" (toString $value)) -}}
          {{- end -}}
          {{- range .Values.extraEnv -}}
          {{- $_ := set $env .name (omit . "name") -}}
          {{- end -}}
          {{- range $key, $entry := $env -}}
          {{- if and (hasKey $entry "value") (eq (toString (get $entry "value")) "") -}}
          {{- $_ := unset $env $key -}}
          {{- end -}}
          {{- end -}}
          env:
          {{- range $key := keys $env | sortAlpha }}
            - name: {{ $key }}
            {{- with get $env $key }}
            {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "duty-scheduling.dataClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
