<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>网络服务协会</title>
  <link rel="icon" href="/icon/gdutnic.png">
  <meta name="theme-color" content="#1B6D88">
<script src="/static/browser-motion.js"></script><script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/auth.css">
  <link rel="stylesheet" href="/static/component-icons.css">
<script src="/static/auth-background.js" defer></script>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/motion.css">
<script src="/static/motion.js" defer></script>
</head>
<body data-admin="true" class="auth-pending">
<section id="authCard" class="admin-board">
  <div class="admin-board-left">
    <div class="admin-logo"><img src="/icon/gdutnic.png" alt="网协标志"></div>
    <h1 id="authTitle">$auth_title</h1>
    <p id="authHint">$auth_hint</p>
  </div>
  <form id="authForm" data-registering="$registering" method="post" action="$login_action" class="admin-board-right">
    <input type="hidden" name="login_csrf" value="$login_csrf">
    <label class="outlined-field"><input name="username" autocomplete="username" placeholder="$username_placeholder" $username_required><span>用户名</span></label>
    <label class="outlined-field"><input name="password" type="password" autocomplete="current-password" placeholder=" " required><span>密码</span></label>
    <label id="loginNewPassword" class="outlined-field" $password_change_hidden><input name="new_password" type="password" autocomplete="new-password" placeholder=" " minlength="6" maxlength="128" $password_change_required><span>新密码</span></label>
    <p id="authStatus" class="admin-auth-status" role="alert">$login_error</p>
    <div class="auth-actions"><button type="button" class="btn tonal" data-keycloak-login="admin" hidden><img class="sso-org-icon" src="/icon/gdutnic.png" alt="" aria-hidden="true"><span>通过GDUTNIC</span></button><button id="authSubmit" type="submit" class="btn primary" data-icon="login">$auth_submit</button></div>
  </form>
</section>
<script src="/static/password-visibility.js"></script>
<script src="/static/ripple.js"></script>
<script src="/static/keycloak-login.js"></script>
<script src="/static/login.js"></script>
</body></html>
