{{- if .Values.secrets.create -}}
{{- $secretName := include "duty-scheduling.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = $existing.data | default dict -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "duty-scheduling.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- else if and (hasKey $existingData $key) (index $existingData $key) }}
  {{ $key }}: {{ index $existingData $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
