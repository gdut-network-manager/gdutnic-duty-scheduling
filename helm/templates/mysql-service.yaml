{{- if .Values.mysql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "duty-scheduling.mysqlFullname" . }}
  labels:
    {{- include "duty-scheduling.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "duty-scheduling.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
{{- end }}
