services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gdutnic}
      MYSQL_USER: ${MYSQL_USER:-gdutnic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 python -m server.init_data，再使用 --env-file data/.env 启动}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 data/.env 中设置 MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/mysql-config/runtime.cnf:/etc/mysql/conf.d/zz-lower-case.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
