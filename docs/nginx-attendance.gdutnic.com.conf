# 外层 Nginx（TLS 终止） -> ingress-nginx -> duty-scheduling
#
# 用法：把本文件放进最外层 Nginx 的 http {} 里（例如 include
# /etc/nginx/conf.d/attendance.gdutnic.com.conf），再按实际环境改：
#   - upstream 里的 ingress-nginx 地址
#   - 证书路径
#   - 日志路径
#
# 配套 Helm values：
#   clientIpHeader: X-Real-Client-IP
#   publicBaseUrl: https://attendance.gdutnic.com
#   sessionHttpsOnly: "1"
#   ingress.tls: []            # TLS 在这一层终止，Ingress 不要再配 TLS
#   ingress.annotations:
#     nginx.ingress.kubernetes.io/proxy-body-size: "0"
#     nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

# ingress-nginx controller 的地址。默认走 HTTP，避免内外两层都做 TLS。
upstream attendance_ingress_http {
    server 10.0.0.10:80;      # TODO: 改成 ingress-nginx 的 Service ClusterIP / 节点 IP
    keepalive 32;
}

# 如果必须从外层 Nginx 连 ingress 的 HTTPS，改用这段，并在 location 里换成
# proxy_pass https://attendance_ingress_https;
# upstream attendance_ingress_https {
#     server 10.0.0.10:443;
#     keepalive 32;
# }

server {
    listen 80;
    server_name attendance.gdutnic.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name attendance.gdutnic.com;

    # 证书按实际文件改；泛域名证书可继续用 gdutnic.com.pem / gdutnic.com.key
    ssl_certificate     /home/nginx/cert/attendance.gdutnic.com.pem;
    ssl_certificate_key /home/nginx/cert/attendance.gdutnic.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=63072000; preload" always;

    client_max_body_size 0;

    location / {
        proxy_pass http://attendance_ingress_http;

        # ingress 按 Host 匹配规则，必须原样透传
        proxy_set_header Host $host;

        # 应用读取的真实客户端 IP。必须用 proxy_set_header 覆盖，
        # 不能用 add_header 追加，否则客户端可以伪造同名头。
        proxy_set_header X-Real-Client-IP $remote_addr;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # 应用当前不使用 WebSocket。需要时改成 map $http_upgrade $connection_upgrade
        # 并把这里换成 $connection_upgrade。
        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_connect_timeout 300;
        proxy_send_timeout    300;
        proxy_read_timeout    300;

        # 连 ingress HTTPS 时启用：
        # proxy_ssl_server_name on;
        # proxy_ssl_name attendance.gdutnic.com;
        # proxy_ssl_verify on;
        # proxy_ssl_trusted_certificate /path/to/internal-ca.crt;
        # 自签证书又不想校验时用 proxy_ssl_verify off;
    }

    access_log /home/nginx/logs/attendance.gdutnic.log;
    error_log  /home/nginx/logs/attendance.gdutnic.error.log;
}
